apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudtasks-deployment
  namespace: cloudtasks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudtasks
  template:
    metadata:
      labels:
        app: cloudtasks
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: cloudtasks
        image: shayandsolomon/cloudtasks:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 12
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cloudtasks-secret
              key: DATABASE_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: cloudtasks-secret
              key: OPENAI_API_KEY