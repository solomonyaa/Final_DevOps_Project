name: Terraform Apply

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROJECT_AWS_ADMIN_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.PROJECT_AWS_ADMIN_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create S3 state bucket if not exists
        run: |
          aws s3api head-bucket --bucket cloudtasks-tfstate 2>/dev/null || \
          aws s3api create-bucket \
            --bucket cloudtasks-tfstate \
            --region us-east-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate
      
      - name: Import existing resources
        env:
          TF_VAR_rds_username: ${{ secrets.POSTGRES_USER }}
          TF_VAR_rds_password: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          terraform import aws_iam_role.rds_monitoring_role cloudtasks-rds-monitoring-role || true
          terraform import aws_iam_role.bastion_role cloudtasks-bastion-role || true
          terraform import aws_db_subnet_group.rds_subnet_group cloudtasks-rds-subnet-group || true

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_rds_username: ${{ secrets.POSTGRES_USER }}
          TF_VAR_rds_password: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          terraform plan -out=tfplan 2>&1 | tee plan_output.txt
          echo "### Terraform Plan" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Terraform Apply
        env:
          TF_VAR_rds_username: ${{ secrets.POSTGRES_USER }}
          TF_VAR_rds_password: ${{ secrets.POSTGRES_PASSWORD }}
        run: terraform apply -auto-approve tfplan

      - name: Show Terraform Outputs
        run: |
          echo "### Terraform Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Save RDS endpoint to GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          gh secret set RDS_ENDPOINT --body "$RDS_ENDPOINT" --repo ${{ github.repository }}
          echo "✅ RDS_ENDPOINT saved to GitHub Secrets: $RDS_ENDPOINT"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name $(terraform output -raw eks_cluster_name) \
            --region ${{ env.AWS_REGION }}

      - name: Verify EKS connection
        run: kubectl get nodes
