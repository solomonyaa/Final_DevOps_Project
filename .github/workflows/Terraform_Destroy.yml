name: Terraform Destroy
on:
  workflow_dispatch:  # manual trigger

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROJECT_AWS_ADMIN_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.PROJECT_AWS_ADMIN_SECRET }}
          aws-region: us-east-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Destroy
        env:
          TF_VAR_rds_username: ${{ secrets.POSTGRES_USER }}
          TF_VAR_rds_password: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          cd terraform
          terraform destroy -auto-approve
