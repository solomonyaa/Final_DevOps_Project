name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "destroy" to confirm you want to destroy all infrastructure'
        required: true
        type: string

env:
  AWS_REGION: us-east-1

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm intent
        if: ${{ github.event.inputs.confirmation != 'destroy' }}
        run: |
          echo "❌ Confirmation input was '${{ github.event.inputs.confirmation }}', expected 'destroy'. Aborting."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROJECT_AWS_ADMIN_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.PROJECT_AWS_ADMIN_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan Destroy
        env:
          TF_VAR_rds_username: ${{ secrets.POSTGRES_USER }}
          TF_VAR_rds_password: ${{ secrets.POSTGRES_PASSWORD }}
        run: terraform plan -destroy -out=destroy.tfplan
        working-directory: terraform

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cloudtasks-cluster --region us-east-1

      - name: Uninstall Helm releases
        run: |
          helm uninstall ingress-nginx -n ingress-nginx || true
          helm uninstall kube-prometheus-stack -n monitoring || true

      - name: Terraform Destroy
        env:
          TF_VAR_rds_username: ${{ secrets.POSTGRES_USER }}
          TF_VAR_rds_password: ${{ secrets.POSTGRES_PASSWORD }}
        run: terraform destroy -auto-approve
        working-directory: terraform
