name: CD Workflow - Login to Dockerhub, Build, Push

on:
  push:
    branches:
      - main

jobs:
  on-merge:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudtasks:latest \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudtasks:${{ github.sha }} .

      - name: Push latest tag
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudtasks:latest

      - name: Push SHA tag
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudtasks:${{ github.sha }}
