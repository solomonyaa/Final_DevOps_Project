name: Deploy to EKS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROJECT_AWS_ADMIN_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.PROJECT_AWS_ADMIN_SECRET }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name cloudtasks-cluster --region us-east-1

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Create DockerHub pull secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_PASSWORD }} \
            --docker-server=https://index.docker.io/v1/ \
            --namespace=cloudtasks \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes secret
        run: |
          kubectl create secret generic cloudtasks-secret \
            --from-literal=DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.RDS_ENDPOINT }}/taskdb \
            --from-literal=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            --namespace=cloudtasks \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply remaining manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Deploy latest image to EKS
        run: |
          kubectl set image deployment/cloudtasks-deployment \
            cloudtasks=${{ secrets.DOCKERHUB_USERNAME }}/cloudtasks:latest \
            --namespace=cloudtasks
          kubectl rollout restart deployment/cloudtasks-deployment --namespace=cloudtasks
          kubectl rollout status deployment/cloudtasks-deployment --namespace=cloudtasks --timeout=300s

      - name: Debug pod status on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n cloudtasks -o wide || true
          echo "=== Describe All Pods ==="
          kubectl describe pods -n cloudtasks || true
          echo "=== Logs: pod 1 ==="
          POD1=$(kubectl get pods -n cloudtasks -l app=cloudtasks -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          [ -n "$POD1" ] && kubectl logs -n cloudtasks "$POD1" --tail=80 || true
          echo "=== Logs: pod 2 ==="
          POD2=$(kubectl get pods -n cloudtasks -l app=cloudtasks -o jsonpath='{.items[1].metadata.name}' 2>/dev/null)
          [ -n "$POD2" ] && kubectl logs -n cloudtasks "$POD2" --tail=80 || true
