name: Deploy to EKS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROJECT_AWS_ADMIN_ACCESSKEY }}
          aws-secret-access-key: ${{ secrets.PROJECT_AWS_ADMIN_SECRET }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name cloudtasks-cluster --region us-east-1

      - name: Install NGINX Ingress Controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/aws/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=complete job \
            --selector=app.kubernetes.io/component=admission-webhook \
            --timeout=60s || true
          kubectl rollout restart deployment/ingress-nginx-controller -n ingress-nginx
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Create DockerHub pull secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_PASSWORD }} \
            --docker-server=https://index.docker.io/v1/ \
            --namespace=cloudtasks \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes secret
        run: |
          kubectl create secret generic cloudtasks-secret \
            --from-literal=DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.RDS_ENDPOINT }}/taskdb \
            --from-literal=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            --namespace=cloudtasks \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply remaining manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Deploy latest image to EKS
        run: |
          kubectl set image deployment/cloudtasks-deployment \
            cloudtasks=${{ secrets.DOCKERHUB_USERNAME }}/cloudtasks:latest \
            --namespace=cloudtasks
          kubectl rollout restart deployment/cloudtasks-deployment --namespace=cloudtasks
          kubectl rollout status deployment/cloudtasks-deployment --namespace=cloudtasks --timeout=300s

      - name: Install Prometheus and Grafana
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --set grafana.adminPassword=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --set grafana.service.type=LoadBalancer \
            --set prometheus.prometheusSpec.retention=24h \
            --set alertmanager.enabled=false \
            --wait --timeout=5m

      - name: Print URLs
        run: |
          echo "### Application URLs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "App URL:" >> $GITHUB_STEP_SUMMARY
          kubectl get ingress -n cloudtasks -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Grafana URL:" >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n monitoring monitoring-grafana -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Grafana login: admin / (GRAFANA_ADMIN_PASSWORD secret)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Debug pod status on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n cloudtasks -o wide || true
          echo "=== Describe All Pods ==="
          kubectl describe pods -n cloudtasks || true
          echo "=== Logs: pod 1 ==="
          POD1=$(kubectl get pods -n cloudtasks -l app=cloudtasks -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          [ -n "$POD1" ] && kubectl logs -n cloudtasks "$POD1" --tail=80 || true
          echo "=== Logs: pod 2 ==="
          POD2=$(kubectl get pods -n cloudtasks -l app=cloudtasks -o jsonpath='{.items[1].metadata.name}' 2>/dev/null)
          [ -n "$POD2" ] && kubectl logs -n cloudtasks "$POD2" --tail=80 || true
